[project]
name = "urss-attention-vs-information"
version = "0.1.0"
description = "Virtual environment for my URSS project"
authors = [
    {name = "Daniel Jordanou-Bailey",email = "dan.jordanou-bailey@warwick.ac.uk"}
]
readme = "README.md"
requires-python = "^3.14"
dependencies = [
    "transformers (>=5.13.1,<6.0.0)",
    "transformer-lens (>=3.5.1,<4.0.0)",
    "numpy (>=2.5.1,<3.0.0)",
    "pandas (>=3.0.3,<4.0.0)",
    "matplotlib (>=3.11.0,<4.0.0)",
    "scipy (>=1.18.0,<2.0.0)",
    "pyinform (>=0.2.0,<0.3.0)",
    "dit (>=2.1,<3.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
